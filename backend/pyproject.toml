[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openplayout"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "defusedxml>=0.7,<1", "tzdata>=2025.1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["caspar: optional tests against a real CasparCG server"]
